# Deploy Express + Socket.io + static client as one web service.
# MongoDB: use Atlas (scripts/atlas-bootstrap.sh) and set MONGO_URI in the dashboard.
services:
  - type: web
    name: gila-community
    runtime: node
    # Free sleeps when idle. Paid "starter" stays awake but needs a card on file.
    # Cold starts are mitigated by .github/workflows/keepalive.yml
    plan: free
    region: oregon
    # Include devDependencies so Vite/TypeScript are available during build
    # (Render sets NODE_ENV=production which would otherwise skip them).
    buildCommand: NPM_CONFIG_PRODUCTION=false npm install && NPM_CONFIG_PRODUCTION=false npm install --prefix client && NPM_CONFIG_PRODUCTION=false npm install --prefix server && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "20"
      - key: TOKEN_KEY
        generateValue: true
      - key: CLIENT_URL
        sync: false
      - key: MONGO_URI
        sync: false
